<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Building Buddy · Administración de edificios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1EF;--surface:#FFFFFF;--surface2:#F5F7F6;--ink:#1E2B33;--muted:#5B6970;--line:#D5DCDA;
  --brand:#1F5C63;--brand-ink:#FFFFFF;--brand-soft:#DCEBEC;--brass:#9C6B1F;
  --ok:#2E7D4F;--ok-bg:#E2F1E7;--warn:#8F5C0E;--warn-bg:#FBEED5;--bad:#B23A30;--bad-bg:#F8E0DC;--info:#2F5F99;--info-bg:#E0E9F5;
  --facade:#D6CFC2;--facade-dark:#BDB4A5;--frame:#7E776A;--locked:#9AA3A7;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12191C;--surface:#1A2327;--surface2:#1F2A2F;--ink:#E4EAE8;--muted:#9BA8AD;--line:#2E3B41;
  --brand:#5DAFB5;--brand-ink:#0E1A1C;--brand-soft:#1F3A3D;--brass:#D6A24E;
  --ok:#6CC08E;--ok-bg:#183326;--warn:#E3AE55;--warn-bg:#3A2C12;--bad:#EE8277;--bad-bg:#3D1C19;--info:#86AEE3;--info-bg:#1B2A3E;
  --facade:#3A3630;--facade-dark:#2C2924;--frame:#8C8475;--locked:#56616A;
}}
:root[data-theme="dark"]{
  --bg:#12191C;--surface:#1A2327;--surface2:#1F2A2F;--ink:#E4EAE8;--muted:#9BA8AD;--line:#2E3B41;
  --brand:#5DAFB5;--brand-ink:#0E1A1C;--brand-soft:#1F3A3D;--brass:#D6A24E;
  --ok:#6CC08E;--ok-bg:#183326;--warn:#E3AE55;--warn-bg:#3A2C12;--bad:#EE8277;--bad-bg:#3D1C19;--info:#86AEE3;--info-bg:#1B2A3E;
  --facade:#3A3630;--facade-dark:#2C2924;--frame:#8C8475;--locked:#56616A;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:15px/1.5 "Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque","Public Sans",system-ui,sans-serif;line-height:1.15;margin:0;font-weight:700}
h1{font-size:clamp(1.6rem,4vw,2.3rem);letter-spacing:-.01em}
h2{font-size:1.35rem}h3{font-size:1.05rem}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.small{font-size:.85rem}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
img{max-width:100%}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;border:1px solid var(--brand);background:var(--brand);color:var(--brand-ink);padding:.55rem 1rem;border-radius:8px;font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--brand)}
.btn.quiet{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:.3rem .65rem;font-size:.85rem;border-radius:6px}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.field{display:flex;flex-direction:column;gap:.3rem;margin-bottom:.85rem}
.field label{font-size:.85rem;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.55rem .7rem;width:100%}
.field input[disabled]{background:var(--surface2);color:var(--muted)}
.field textarea{min-height:80px;resize:vertical}
.cellin{width:6.5rem;border:1px solid var(--line);border-radius:6px;padding:.3rem .45rem;background:var(--surface);text-align:right;font-variant-numeric:tabular-nums}
.row{display:flex;gap:.75rem;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:0 .9rem}
.spacer{flex:1}

.shell{min-height:100%;display:grid;grid-template-columns:240px 1fr;grid-template-rows:auto 1fr;grid-template-areas:"top top" "nav main"}
.top{grid-area:top;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:1rem;padding:.6rem 1.25rem}
.brand{display:flex;align-items:center;gap:.55rem;font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:1.1rem}
.tenant{font-size:.85rem;border-left:1px solid var(--line);padding-left:1rem;color:var(--muted)}
.tenant b{color:var(--ink);font-weight:600}
.simdate{font-size:.82rem;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:.2rem .7rem;color:var(--muted)}
.simdate b{color:var(--ink);font-weight:600}
.switch select{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:.35rem .5rem;max-width:210px}
.nav{grid-area:nav;padding:1rem .75rem;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:.1rem;background:var(--surface2)}
.nav .grp{font-size:.76rem;font-weight:700;color:var(--muted);padding:.9rem .8rem .25rem}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:.4rem;padding:.5rem .8rem;border-radius:8px;color:var(--muted);font-weight:500}
.nav button:hover{background:var(--surface);color:var(--ink)}
.nav button.on{background:var(--brand-soft);color:var(--ink);font-weight:700}
.nav button.lock{opacity:.6}
.nav button:focus-visible{outline:3px solid var(--brass)}
.badge{background:var(--bad);color:#fff;border-radius:999px;font-size:.72rem;padding:0 .45rem;font-weight:700;min-width:1.3rem;text-align:center}
.main{grid-area:main;padding:1.5rem clamp(1rem,3vw,2.25rem) 3rem;max-width:1200px;width:100%}
.pagehead{display:flex;align-items:flex-end;gap:1rem;flex-wrap:wrap;margin-bottom:1.25rem}
.pagehead p{margin-top:.3rem}
@media (max-width:860px){
  .shell{grid-template-columns:1fr;grid-template-areas:"top" "nav" "main"}
  .top{flex-wrap:wrap;gap:.5rem .75rem;padding:.6rem 1rem}
  .tenant{border:0;padding:0}
  .nav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:.4rem .6rem;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--toph,96px));z-index:15}
  .nav .grp{display:none}
  .nav button{white-space:nowrap}
  .main{padding-top:1rem}
  .top .spacer{display:none}
}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1.1rem 1.2rem;margin-bottom:1.1rem}
.panel>h3{margin-bottom:.8rem}
.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th{text-align:left;font-weight:600;color:var(--muted);font-size:.8rem;padding:.5rem .6rem;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:.6rem;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tfoot td{font-weight:700;border-top:2px solid var(--line)}
.chip{display:inline-block;font-size:.78rem;font-weight:600;padding:.12rem .55rem;border-radius:999px;white-space:nowrap}
.chip.pagado,.chip.validado,.chip.aldia,.chip.activo{background:var(--ok-bg);color:var(--ok)}
.chip.pendiente{background:var(--warn-bg);color:var(--warn)}
.chip.revision,.chip.en_revision{background:var(--info-bg);color:var(--info)}
.chip.vencido,.chip.rechazado,.chip.inactivo{background:var(--bad-bg);color:var(--bad)}
.chip.tag{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.chip.anulado{background:var(--surface2);color:var(--muted);text-decoration:line-through}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:.55rem;margin:.6rem 0 1rem}
.slot{all:unset;box-sizing:border-box;cursor:pointer;border:2px solid var(--ok);background:var(--ok-bg);border-radius:10px;padding:.6rem .7rem;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.slot small{display:block;font-weight:500;font-size:.75rem;color:var(--muted)}
.slot:hover{filter:brightness(.97)}
.slot:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.slot[disabled]{cursor:not-allowed;border-color:var(--line);background:var(--surface2);color:var(--muted)}
.wiz{max-width:820px;margin:0 auto;padding:1.5rem clamp(1rem,3vw,2rem) 3rem}
.dias{display:flex;gap:.4rem;flex-wrap:wrap}
.dias label{display:flex;gap:.3rem;align-items:center;border:1px solid var(--line);border-radius:8px;padding:.3rem .55rem;font-size:.85rem;cursor:pointer}
.dias label:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.errlist{background:var(--bad-bg);color:var(--bad);border-radius:8px;padding:.6rem .9rem;font-size:.86rem;margin:.6rem 0}
.errlist p+p{margin-top:.2rem}
.tabs{display:flex;gap:.3rem;border-bottom:1px solid var(--line);margin-bottom:1rem;overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:.55rem .9rem;color:var(--muted);font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-color:var(--brand)}
.empty{padding:1.5rem;text-align:center;color:var(--muted)}
.hint{background:var(--surface2);border:1px dashed var(--line);border-radius:8px;padding:.65rem .8rem;font-size:.86rem;color:var(--muted)}
.warnbox{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:.65rem .8rem;font-size:.86rem}
.note{background:var(--bad-bg);color:var(--bad);border-radius:8px;padding:.45rem .7rem;font-size:.85rem;margin-top:.35rem}

/* Dashboard de módulos */
.mods{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1rem}
.mod{all:unset;box-sizing:border-box;cursor:pointer;position:relative;display:flex;flex-direction:column;gap:.55rem;padding:1.2rem 1.2rem 1.1rem;border-radius:14px;background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--c);min-height:200px;transition:transform .15s,box-shadow .15s}
.mod:hover{transform:translateY(-3px);box-shadow:0 14px 28px -18px var(--c)}
.mod:focus-visible{outline:3px solid var(--brass);outline-offset:3px}
.mod .ico{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:var(--c);color:#fff;margin-bottom:.2rem}
.mod p{color:var(--muted);font-size:.9rem}
.mod .metric{font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
.mod .cta{margin-top:auto;font-weight:700;color:var(--c)}
.mod .flag{position:absolute;top:1rem;right:1rem}
.mod.locked{background:var(--surface2);border-top-color:var(--locked)}
.mod.locked .ico{background:var(--locked)}
.mod.locked h3,.mod.locked .metric{color:var(--muted)}
.mod.locked .cta{color:var(--muted)}
.mod.locked:hover{box-shadow:0 14px 28px -20px rgba(0,0,0,.4)}
.flag-trial{background:var(--c);color:#fff}

/* Onboarding */
.stepper{display:flex;gap:.5rem;flex-wrap:wrap;margin:0 0 1.2rem;list-style:none;padding:0}
.stepper button{all:unset;cursor:pointer;display:flex;gap:.5rem;align-items:center;padding:.4rem .85rem .4rem .45rem;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.88rem;font-weight:600}
.stepper button:focus-visible{outline:3px solid var(--brass)}
.stepper .n{width:1.6rem;height:1.6rem;border-radius:50%;display:grid;place-items:center;font-size:.8rem;background:var(--surface2);border:1px solid var(--line)}
.stepper .done .n{background:var(--ok);color:#fff;border-color:var(--ok)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:.8rem;margin-bottom:1rem}
.opt{display:flex;gap:.75rem;padding:1rem;border:2px solid var(--line);border-radius:12px;cursor:pointer;align-items:flex-start;background:var(--surface)}
.opt input{margin-top:.25rem;accent-color:var(--brand)}
.opt:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.opt b{display:block}
.meter{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden;border:1px solid var(--line);margin:.35rem 0 .2rem}
.meter div{height:100%;background:var(--ok)}
.meter.warn div{background:var(--brass)}

/* Fachada */
.hero{display:grid;grid-template-columns:minmax(280px,420px) 1fr;gap:1.5rem;margin-bottom:1.25rem;align-items:start}
@media (max-width:860px){.hero{grid-template-columns:1fr}}
.facade{background:var(--facade);border:2px solid var(--frame);border-radius:10px 10px 0 0;padding:0 .9rem}
.roof{margin:0 -.9rem;padding:.55rem .9rem;background:var(--frame);color:#F4F1EA;font-family:"Bricolage Grotesque",sans-serif;font-weight:700;display:flex;justify-content:space-between;border-radius:7px 7px 0 0;font-size:.95rem}
.floor{display:grid;gap:.6rem;padding:.6rem 0;border-bottom:3px solid var(--facade-dark)}
.win{all:unset;cursor:pointer;border:3px solid var(--frame);border-radius:4px;padding:.45rem .5rem;min-height:74px;display:flex;flex-direction:column;justify-content:space-between;background:var(--surface);transition:transform .12s;min-width:0}
.win:hover{transform:translateY(-2px)}
.win:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.win b{font-family:"Bricolage Grotesque",sans-serif;font-size:1.15rem}
.win span{font-size:.72rem;color:var(--muted);line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.win em{font-style:normal;font-size:.75rem;font-weight:700}
.win.s-aldia{background:var(--ok-bg)}.win.s-aldia em{color:var(--ok)}
.win.s-pendiente{background:var(--warn-bg)}.win.s-pendiente em{color:var(--warn)}
.win.s-revision{background:var(--info-bg)}.win.s-revision em{color:var(--info)}
.win.s-vencido{background:var(--bad-bg)}.win.s-vencido em{color:var(--bad)}
.ground{height:54px;display:flex;justify-content:center;align-items:flex-end}
.door{width:70px;height:44px;border:3px solid var(--frame);border-bottom:0;border-radius:4px 4px 0 0;background:var(--surface2)}
.base{height:10px;background:var(--frame);border-radius:0 0 4px 4px;margin:0 -2px}
.legend{display:flex;gap:.9rem;flex-wrap:wrap;margin-top:.7rem;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:.8rem;height:.8rem;border-radius:3px;margin-right:.3rem;vertical-align:-1px;border:1px solid var(--frame)}

.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--line);margin:1rem 0}
.fig{background:var(--surface);padding:.85rem 1rem}
.fig small{display:block;color:var(--muted);font-size:.8rem}
.fig strong{display:block;font-size:1.3rem;font-family:"Bricolage Grotesque",sans-serif;font-variant-numeric:tabular-nums}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:2rem 1fr auto;gap:.75rem;align-items:center;padding:.75rem 0;border-bottom:1px solid var(--line)}
.steps li:last-child{border-bottom:0}
.steps li::before{content:counter(s);width:2rem;height:2rem;border-radius:50%;display:grid;place-items:center;font-weight:700;border:2px solid var(--line);color:var(--muted)}
.steps li.done::before{content:"✓";background:var(--ok);border-color:var(--ok);color:#fff}

.statement{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:clamp(1rem,3vw,2rem);max-width:860px}
.st-head{display:flex;justify-content:space-between;gap:1rem;align-items:flex-start;border-bottom:2px solid var(--ink);padding-bottom:1rem;margin-bottom:1rem}
.stamp{border:2px solid currentColor;border-radius:6px;padding:.25rem .7rem;font-weight:700;transform:rotate(-3deg);font-family:"Bricolage Grotesque",sans-serif;white-space:nowrap}
.stamp.oficial{color:var(--ok)}.stamp.borrador{color:var(--warn)}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.6rem;margin:0 0 .5rem}
.meta dt{font-size:.78rem;color:var(--muted)}.meta dd{margin:0;font-weight:600}
.statement h3{margin:1.4rem 0 .5rem}

/* Recibo: papel siempre claro, formal */
.recibo{background:#fff;color:#1B2328;border:1px solid #D5DCDA;border-radius:10px;padding:clamp(1rem,3vw,1.8rem);font-size:.9rem}
.recibo h2{font-size:1.3rem}
.recibo .mut{color:#5B6970}
.recibo th{color:#5B6970;border-color:#E1E6E4}
.recibo td{border-color:#E1E6E4;padding:.45rem .5rem}
.recibo th{padding:.4rem .5rem}
.recibo .rh{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;border-bottom:2px solid #1B2328;padding-bottom:.8rem;margin-bottom:1rem}
.recibo .rmeta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.5rem 1rem;margin-bottom:1rem}
.recibo .rmeta dt{font-size:.74rem;color:#5B6970}.recibo .rmeta dd{margin:0;font-weight:600}
.recibo h4{font-family:"Bricolage Grotesque",sans-serif;font-size:.95rem;margin:1.1rem 0 .35rem}
.recibo .total{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;background:#E3EFEF;border-radius:8px;padding:.85rem 1rem;margin-top:1rem}
.recibo .total strong{font-size:1.6rem;font-family:"Bricolage Grotesque",sans-serif;font-variant-numeric:tabular-nums}
.recibo .rstamp{border:2px solid currentColor;border-radius:6px;padding:.2rem .6rem;font-weight:700;font-family:"Bricolage Grotesque",sans-serif;align-self:flex-start}
.recibo .paid{color:#2E7D4F}.recibo .due{color:#8F5C0E}.recibo .late{color:#B23A30}
.recibo .foot{margin-top:1.1rem;padding-top:.8rem;border-top:1px dashed #C9D1CF;font-size:.8rem;color:#5B6970;display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.recibo tfoot td{border-top:2px solid #1B2328}
#printarea{display:none}

.bars{display:flex;flex-direction:column;gap:.6rem}
.bar{display:grid;grid-template-columns:minmax(110px,190px) 1fr auto;gap:.7rem;align-items:center;font-size:.88rem}
.bar .track{height:12px;background:var(--surface2);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.bar .fill{height:100%;background:var(--brand)}
.cols{display:flex;align-items:flex-end;gap:1rem;height:180px;padding-top:.5rem;overflow-x:auto}
.col{display:flex;flex-direction:column;align-items:center;gap:.3rem;min-width:70px;flex:1}
.col .pair{display:flex;gap:4px;align-items:flex-end;height:140px}
.col .pair div{width:18px;border-radius:4px 4px 0 0}

.balance{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;align-items:center;background:var(--brand-soft);border-radius:12px;padding:1.2rem 1.3rem;margin-bottom:1.1rem}
.balance strong{font-family:"Bricolage Grotesque",sans-serif;font-size:clamp(1.8rem,5vw,2.6rem);display:block;font-variant-numeric:tabular-nums}
.due-row{display:flex;gap:1rem;align-items:center;padding:.8rem 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.due-row:last-child{border-bottom:0}
.due-row .what{flex:1;min-width:180px}

.cards3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.8rem;margin-bottom:1rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1rem}
.trialbar{display:flex;gap:1rem;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:10px;padding:.75rem 1rem;margin-bottom:1rem}

.chat{display:flex;flex-direction:column;height:min(70vh,640px);background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.chatlog{flex:1;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:.6rem}
.msg{max-width:78%;padding:.55rem .8rem;border-radius:12px;background:var(--surface2);border:1px solid var(--line)}
.msg .who{font-size:.76rem;font-weight:700;color:var(--muted);margin-bottom:.15rem}
.msg.me{align-self:flex-end;background:var(--brand-soft);border-color:transparent}
.msg.adm .who{color:var(--brass)}
.chatin{display:flex;gap:.5rem;padding:.6rem;border-top:1px solid var(--line)}
.chatin input{flex:1;border:1px solid var(--line);border-radius:8px;padding:.55rem .7rem;background:var(--surface2)}

.login{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:1.5rem}

/* =========================================================
   CÁLCULO DE CUOTAS
   Opción 1 · Fija por alícuota: todos los gastos × (área depto / área total)
   Opción 2 · Mixta con agua: el recibo de agua se separa; el riego de áreas
   comunes vuelve a gastos comunes (por alícuota) y el resto del agua se
   reparte según la lectura de cada departamento.
   ========================================================= */
function calcular(p,st){
  st=st||S;
  const cfg=st.config,deps=st.departamentos,gas=st.gastos.filter(g=>g.periodo===p);
  const total=sum(gas),a=st.agua[p];
  const mixta=cfg.tipoCalculo==='mixta'&&!!a&&a.monto>0;
  let comun=total,aguaDep=0,riegoCosto=0,sumL=0;
  if(mixta){
    riegoCosto=a.consumo>0?a.monto*Math.min(a.riego,a.consumo)/a.consumo:0;
    aguaDep=a.monto-riegoCosto;
    comun=total-a.monto+riegoCosto;
    sumL=deps.reduce((t,d)=>t+Number(a.lecturas?.[d.id]||0),0);
  }
  const at=Number(cfg.areaTotal)||deps.reduce((t,d)=>t+d.area,0);
  const filas=deps.map(d=>{
    const alic=d.area/at,m3=mixta?Number(a.lecturas?.[d.id]||0):0;
    const cc=r2(comun*alic),ag=mixta?r2(sumL>0?aguaDep*m3/sumL:aguaDep*alic):0;
    return{id:d.id,area:d.area,alic,comun:cc,m3,agua:ag,total:r2(cc+ag)};
  });
  return{p,total,comun,aguaDep,riegoCosto,sumL,mixta,filas,at,sumAlic:filas.reduce((t,f)=>t+f.alic,0)};
}

// RN-29: 90 días sin movimiento y sin plan pagado → se elimina todo
function depurarInactivos(){
  const out=[];
  Object.entries(DB.edificios).forEach(([cod,s])=>{if(!s.suscripcionPagada&&diasSinMov(s)>=90){out.push(s.config.edificio);delete DB.edificios[cod]}});

  if(p.some(c=>c.estado==='en_revision'))return'revision';
  if(p.length)return'pendiente';
  return'aldia';
}
const tipoC=id=>S.compromisos.find(c=>c.id===id)?.tipo||'cuota';

function aplicarCorte(){
  S.periodos.forEach(p=>{
    const vence=p.id+'-'+pad(S.config.diaCorte);
    if(hoy()<=vence||S.cortes[p.id])return;
    const morosos=[];
    S.compromisos.filter(c=>c.periodo===p.id&&c.tipo==='cuota'&&c.estado==='pendiente').forEach(c=>{
      c.moroso=true;if(!morosos.includes(c.deptoId))morosos.push(c.deptoId);
      if(S.config.mora>0)S.compromisos.push({id:uid('cmp'),deptoId:c.deptoId,periodo:p.id,tipo:'mora',concepto:'Mora por pago fuera de plazo, '+plabel(p.id),monto:Number(S.config.mora),emitido:p.id+'-'+pad(S.config.diaCorte+1),vence:lastDay(p.id),estado:'pendiente'});
    });
    S.cortes[p.id]={fecha:p.id+'-'+pad(S.config.diaCorte+1),deptos:morosos};
  });
}

// Mantiene el gasto "Agua" sincronizado con el recibo de agua registrado
function syncAgua(p){
  const a=S.agua[p];let g=S.gastos.find(x=>x.periodo===p&&x.auto==='agua');
  if(!a||!(a.monto>0)){if(g)S.gastos=S.gastos.filter(x=>x!==g);return}
  if(g)g.monto=a.monto;else S.gastos.push({id:uid('gas'),periodo:p,tipo:'recurrente',categoria:'Agua',descripcion:'Recibo de agua del edificio',monto:a.monto,fecha:p+'-10',auto:'agua'});
}

// RN-36: la garantía no es ingreso; solo la parte retenida por daños, en el mes en que se retiene
function resumen(p){
  const val=S.pagos.filter(x=>x.estado==='validado'&&tipoC(x.compromisoId)!=='garantia');
  const ret=(S.reservas||[]).filter(r=>r.gEstado==='retenida'&&r.gCerrada);
  const ing=val.filter(x=>x.fecha.slice(0,7)===p);
  const retP=ret.filter(r=>r.gCerrada.slice(0,7)===p);
  const gas=S.gastos.filter(g=>g.periodo===p);
  const ids=[...new Set([...S.periodos.map(x=>x.id),...val.map(x=>x.fecha.slice(0,7)),...S.gastos.map(g=>g.periodo),...ret.map(r=>r.gCerrada.slice(0,7))])].sort();
  let ant=Number(S.config.saldoInicial);
  ids.filter(x=>x<p).forEach(x=>{ant+=sum(val.filter(y=>y.fecha.slice(0,7)===x))+sum(ret.filter(r=>r.gCerrada.slice(0,7)===x),r=>r.gRetenida)-sum(S.gastos.filter(g=>g.periodo===x))});
  const ti=sum(ing)+sum(retP,r=>r.gRetenida),tg=sum(gas);
  return{ing,retP,gas,ti,tg,ant,acum:ant+ti-tg};
}

function parseDeptos(txt){
  const filas=[],errores=[],vistos=new Set();
  String(txt||'').split(/\r?\n/).map(l=>l.replace(/\s+$/,'')).filter(l=>l.trim()).forEach((l,i)=>{
    const sep=l.includes('\t')?'\t':l.includes(';')?';':',';
    const c=l.split(sep).map(x=>x.trim().replace(/^"|"$/g,''));
    if(i===0&&/n[uú]mero|depto|departamento/i.test(c[0]))return;
    const [numero='',piso='',area='',prop='',inq='',email='',tel='']=c;const n=i+1;
    const a=parseFloat(String(area).replace(',','.'));let e=null;
    if(!/^[0-9A-Za-z-]{1,8}$/.test(numero))e='número de departamento no válido';
    else if(vistos.has(numero))e=`el departamento ${numero} está repetido`;
    else if(!(a>0))e='el área debe ser un número mayor que cero';
    else if(!prop)e='falta el propietario';
    else if(email&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email))e='correo no válido';
    if(e)errores.push(`Fila ${n}${numero?` (depto ${esc(numero)})`:''}: ${e}`);
    vistos.add(numero);
    filas.push({numero,piso:parseInt(piso)||Math.floor((parseInt(numero)||0)/100),area:a,prop,inq,email,tel});
  });
  return{filas,errores};
}

function nuevoEdificio(w){

  const s={config:{codigo:w.ed.codigo,edificio:w.ed.nombre,direccion:w.ed.direccion,admin:w.cuenta.nombre,totalDeptos:+w.ed.total,areaTotal:+w.ed.area,tipoCalculo:w.tipo,mora:20,diaCorte:15,saldoInicial:0,fechaSim:h,publicarDesglose:true,banco:'',yape:''},
    departamentos:[],personas:[],ocupaciones:[],usuarios:[{id:'u_admin',login:'admin',pass:w.cuenta.pass,email:w.cuenta.email.toLowerCase(),rol:'admin',deptoId:null,personaId:null,estado:'activo'}],
    periodos:[{id:w.ed.mes,estado:'abierto',gastosConfirmados:false}],compromisos:[],pagos:[],gastos:[],agua:{},chat:[],cortes:{},recibos:[],modulos:{},zonas:[],bloqueos:[],reservas:[],tickets:[],solicitudes:[],
    ultimaActividad:h,suscripcionPagada:false};
  w.filas.forEach(f=>{
    s.departamentos.push({id:f.numero,piso:f.piso,area:r2(f.area)});
    const pid=uid('per');s.personas.push({id:pid,nombre:f.prop,dni:'',telefono:f.inq?'':f.tel,email:f.inq?'':f.email});
    s.ocupaciones.push({id:uid('oc'),deptoId:f.numero,personaId:pid,tipo:'propietario',desde:h,hasta:null,activo:true});let resp=pid;
    if(f.inq){const iid=uid('per');s.personas.push({id:iid,nombre:f.inq,dni:'',telefono:f.tel,email:f.email});s.ocupaciones.push({id:uid('oc'),deptoId:f.numero,personaId:iid,tipo:'inquilino',desde:h,hasta:null,activo:true});resp=iid}

function onboardingSteps(){

    {t:'Datos del edificio',ok:!!(c.edificio&&c.direccion&&c.totalDeptos>0&&c.areaTotal>0),a:'sec-edificio'},
    {t:'Departamentos',ok:n===Number(c.totalDeptos)&&Math.abs(sa-c.areaTotal)<0.01,a:'sec-deptos'},
    {t:'Cálculo de cuota',ok:c.tipoCalculo==='alicuota'||(S.agua[p]?.monto>0),a:'sec-calculo'},
    {t:'Cobranza',ok:!!(c.banco&&c.diaCorte),a:'sec-cobranza'}

}

function aguaPreview(m,c,r){
  m=+m||0;c=+c||0;r=+r||0;
  if(!m||!c)return'<span class="muted">Ingresa el monto y el consumo general para ver el reparto.</span>';
  if(r>c)return'<span class="neg">El riego no puede superar el consumo general.</span>';
  const rc=m*r/c;
  return `Costo por m³: <b>${money(m/c)}</b>. Riego de áreas comunes: <b>${money(rc)}</b>, se reparte por alícuota. Agua de departamentos: <b>${money(m-rc)}</b>, se reparte según lecturas.`;
}

function facade(){

  return `<div class="facade">
    <div class="roof"><span>${esc(S.config.edificio)}</span><span>${S.departamentos.length} dptos.</span></div>
    ${floors.map(f=>`<div class="floor" style="grid-template-columns:repeat(${maxU},1fr)">${S.departamentos.filter(d=>d.piso===f).sort((a,b)=>a.id.localeCompare(b.id,undefined,{numeric:true})).map(d=>{

}

VIEWS.calculo=()=>{
  const t=ui.calcTab;
  return `<div class="pagehead"><div><h1>Cálculo y recibos</h1><p class="muted">Los gastos de un mes se reparten entre los departamentos y se cobran en el mes siguiente.</p></div></div>
  <div class="tabs" role="tablist"><button class="${t==='calculo'?'on':''}" data-act="calcTab" data-t="calculo">Cálculo mensual</button><button class="${t==='recibos'?'on':''}" data-act="calcTab" data-t="recibos">Recibos</button></div>
  ${t==='calculo'?calcView():recibosView()}`;
};
function calcView(){
  const p=ui.kp||pActual(),po=periodoObj(p),n=nextP(p),k=calcular(p),mixCfg=S.config.tipoCalculo==='mixta';
  const a=S.agua[p]||{monto:0,consumo:0,riego:0,lecturas:{}},lock=po.gastosConfirmados;

  return `<div class="row" style="margin-bottom:.8rem"><label class="small muted">Gastos de <select data-change="setKP" class="btn quiet sm">${S.periodos.map(x=>`<option value="${x.id}" ${x.id===p?'selected':''}>${Plabel(x.id)}</option>`).join('')}</select></label>
    <span class="small muted">→ cuotas de ${plabel(n)}</span><span class="spacer"></span>${lock?chip('validado').replace('Validado','Gastos confirmados'):chip('pendiente').replace('Pendiente','Gastos sin confirmar')}</div>
  <div class="figs">
    <div class="fig"><small>Gastos del mes</small><strong>${money(k.total)}</strong></div>
    <div class="fig"><small>Gastos comunes por alícuota</small><strong>${money(k.comun)}</strong></div>
    ${k.mixta?`<div class="fig"><small>Agua por lectura (${nf(k.sumL)} m³)</small><strong>${money(k.aguaDep)}</strong></div><div class="fig"><small>Riego descontado</small><strong>${money(k.riegoCosto)}</strong></div>`:`<div class="fig"><small>Método</small><strong style="font-size:1.05rem">Fija por alícuota</strong></div>`}
  </div>
  ${Math.abs(k.sumAlic-1)>0.0001?`<p class="warnbox" style="margin-bottom:1rem">Las alícuotas suman ${pct(k.sumAlic)}, así que las cuotas no cubren exactamente los gastos. Revisa las áreas en Departamentos y ocupantes.</p>`:''}
  ${mixCfg?`<div class="panel"><h3>Recibo de agua y lecturas de ${plabel(p)}</h3>
    ${lock?`<p class="hint" style="margin-bottom:.8rem">Gastos confirmados: los datos de agua están bloqueados.</p>`:''}
    <form data-form="agua"><input type="hidden" name="periodo" value="${p}">
      <div class="grid2">
        <div class="field"><label for="k-m">Monto del recibo (S/)</label><input id="k-m" name="monto" type="number" step="0.01" min="0" value="${a.monto||''}" ${lock?'disabled':''} required></div>
        <div class="field"><label for="k-c">Consumo general (m³)</label><input id="k-c" name="consumo" type="number" step="0.01" min="0" value="${a.consumo||''}" ${lock?'disabled':''} required></div>
        <div class="field"><label for="k-r">Riego de áreas comunes (m³)</label><input id="k-r" name="riego" type="number" step="0.01" min="0" value="${a.riego||0}" ${lock?'disabled':''}></div>
      </div>
      <details ${a.monto?'':'open'}><summary class="small" style="cursor:pointer;margin-bottom:.6rem">Lecturas por departamento (m³)</summary>
      <div class="grid2" style="grid-template-columns:repeat(auto-fit,minmax(110px,1fr))">${S.departamentos.map(d=>`<div class="field"><label for="l${d.id}">Depto ${d.id}</label><input id="l${d.id}" name="lect_${d.id}" type="number" step="0.01" min="0" value="${a.lecturas?.[d.id]??''}" ${lock?'disabled':''}></div>`).join('')}</div></details>
      ${lock?'':'<button class="btn quiet">Guardar agua y lecturas</button>'}
    </form></div>`:''}
  <div class="panel"><div class="row" style="margin-bottom:.6rem"><h3>Cuota por departamento para ${plabel(n)}</h3><span class="spacer"></span>
    ${p===pActual()&&!emitido?`<button class="btn" data-act="go" data-v="mes">Emitir cuotas de ${plabel(n)}</button>`:emitido?`<span class="small muted">Cuotas de ${plabel(n)} ya emitidas</span>`:''}</div>
  <div class="tbl"><table><thead><tr><th>Depto</th><th class="r">Área</th><th class="r">Alícuota</th><th class="r">Gastos comunes</th>${k.mixta?'<th class="r">m³</th><th class="r">Agua</th>':''}<th class="r">Cuota</th><th></th></tr></thead><tbody>
  ${k.filas.map(f=>`<tr><td><b>${f.id}</b></td><td class="r num">${nf(f.area,2)}</td><td class="r num">${pct(f.alic)}</td><td class="r num">${money(f.comun)}</td>${k.mixta?`<td class="r num">${nf(f.m3,2)}</td><td class="r num">${money(f.agua)}</td>`:''}<td class="r num"><b>${money(f.total)}</b></td>
    <td class="r">${emitido?`<button class="btn quiet sm" data-act="recibo" data-id="${f.id}" data-p="${n}">Recibo</button>`:''}</td></tr>`).join('')}
  </tbody><tfoot><tr><td>Total</td><td class="r num">${nf(sum(k.filas,f=>f.area),2)}</td><td class="r num">${pct(k.sumAlic)}</td><td class="r num">${money(sum(k.filas,f=>f.comun))}</td>${k.mixta?`<td class="r num">${nf(k.sumL,2)}</td><td class="r num">${money(sum(k.filas,f=>f.agua))}</td>`:''}<td class="r num">${money(sum(k.filas,f=>f.total))}</td><td></td></tr></tfoot></table></div>
  <p class="small muted" style="margin-top:.6rem">${k.mixta?'Gastos comunes = gastos del mes − recibo de agua + costo del riego, repartidos por alícuota. Agua = (recibo − riego) × lectura del depto ÷ suma de lecturas.':'Cuota = gastos del mes × alícuota del departamento.'}</p></div>`;
}
function recibosView(){
  const per=[...new Set(S.compromisos.filter(c=>c.tipo!=='adelanto'||c.vence<hoy()).map(c=>c.periodo))].filter(x=>x<=pActual()).sort();
  if(!per.length)return '<p class="empty">Aún no hay cargos emitidos. Los recibos aparecen cuando abras el primer mes con cuotas.</p>';
  const p=ui.rcp&&per.includes(ui.rcp)?ui.rcp:per[per.length-1];
  const env=S.recibos.filter(r=>r.periodo===p).length;
  return `<div class="row" style="margin-bottom:.8rem"><label class="small muted">Recibos de <select data-change="setRCP" class="btn quiet sm">${per.map(x=>`<option value="${x}" ${x===p?'selected':''}>${Plabel(x)}</option>`).join('')}</select></label><span class="small muted">${env} de ${S.departamentos.length} enviados</span><span class="spacer"></span><button class="btn" data-act="enviarTodos" data-p="${p}">Generar y enviar todos</button></div>
  <div class="panel"><div class="tbl"><table><thead><tr><th>Depto</th><th>Responsable</th><th class="r">Total a pagar</th><th>Estado</th><th>Envío</th><th class="r"></th></tr></thead><tbody>
  ${S.departamentos.map(d=>{const r=reciboData(d.id,p),e=S.recibos.find(x=>x.deptoId===d.id&&x.periodo===p);
    return `<tr><td><b>${d.id}</b></td><td>${esc(residente(d.id))}</td><td class="r num">${money(r.total)}</td><td>${chip(r.total<=0?'pagado':r.vencido?'vencido':'pendiente')}</td><td>${e?`<span class="chip tag">Enviado ${fdate(e.enviado)}</span>`:'<span class="small muted">No enviado</span>'}</td>
    <td class="r"><button class="btn sm" data-act="recibo" data-id="${d.id}" data-p="${p}">Generar y enviar recibo</button></td></tr>`}).join('')}
  </tbody></table></div></div>`;
}

function reciboData(id,p){
  const mes=S.compromisos.filter(c=>c.deptoId===id&&c.periodo===p&&c.estado!=='anulado');
  const prev=S.compromisos.filter(c=>c.deptoId===id&&c.periodo<p&&c.estado!=='pagado'&&c.estado!=='anulado');
  const subtotal=sum(mes),pagado=sum(mes.filter(c=>c.estado==='pagado'));
  const anterior=sum(prev),total=r2(subtotal-pagado+anterior);
  const cuota=mes.find(c=>c.tipo==='cuota'||c.tipo==='adelanto');
  const vencido=[...mes,...prev].some(c=>estadoC(c)==='vencido');
  return{mes,prev,subtotal,pagado,anterior,total,cuota,vencido,vence:cuota?.vence||p+'-'+pad(S.config.diaCorte)};
}
function reciboHTML(id,p){
  const d=depto(id),c=S.config,r=reciboData(id,p);
  const prop=ocupActiva(id,'propietario'),inq=ocupActiva(id,'inquilino');
  const base=r.cuota?.detalle?.base;
  const lines=r.mes.flatMap(m=>{
    const tag=m.estado==='pagado'?' <span class="mut">(pagado)</span>':'';
    if(m.detalle){const L=[`<tr><td>Gastos comunes de ${plabel(m.detalle.base)}<div class="mut" style="font-size:.8rem">Alícuota ${pct(m.detalle.alic)}</div></td><td class="r num">${money(m.detalle.comun)}</td></tr>`];
      if(m.detalle.agua)L.push(`<tr><td>Consumo de agua<div class="mut" style="font-size:.8rem">${nf(m.detalle.m3,2)} m³ según lectura</div></td><td class="r num">${money(m.detalle.agua)}</td></tr>`);
      if(tag)L.push(`<tr><td colspan="2" class="mut" style="font-size:.8rem">Cuota de ${plabel(p)} pagada</td></tr>`);return L}
    return[`<tr><td>${esc(m.concepto)}${tag}</td><td class="r num">${money(m.monto)}</td></tr>`];
  }).join('');
  const gb=base?S.gastos.filter(g=>g.periodo===base):[];
  const byCat={};gb.forEach(g=>byCat[g.categoria]=(byCat[g.categoria]||0)+g.monto);
  const cls=r.total<=0?'paid':r.vencido?'late':'due',stTxt=r.total<=0?'Pagado':r.vencido?'Vencido':'Por pagar';
  return `<div class="recibo">
    <div class="rh"><div><h2>${esc(c.edificio)}</h2><p class="mut">${esc(c.direccion)}</p><p class="mut">Administración: ${esc(c.admin)}</p></div>
      <div style="text-align:right"><p style="font-weight:700">Recibo de mantenimiento</p><p class="mut">N.° ${p.replace('-','')}-${id}</p><p class="mut">Emitido el ${fdate(hoy())}</p></div></div>
    <div class="row" style="align-items:flex-start;margin-bottom:.4rem"><dl class="rmeta" style="flex:1;margin:0">
      <div><dt>Departamento</dt><dd>${id}, piso ${d.piso}</dd></div>
      <div><dt>Periodo</dt><dd>${Plabel(p)}</dd></div>
      <div><dt>Propietario</dt><dd>${esc(prop?persona(prop.personaId)?.nombre:'—')}</dd></div>
      <div><dt>Inquilino</dt><dd>${inq?esc(persona(inq.personaId)?.nombre):'No aplica'}</dd></div>
      <div><dt>Área</dt><dd>${nf(d.area,2)} m²</dd></div>
      <div><dt>Alícuota</dt><dd>${pct(alic(d))}</dd></div>
    </dl><span class="rstamp ${cls}">${stTxt}</span></div>
    <h4>Detalle del mes</h4>
    <table><tbody>${lines||'<tr><td class="mut">Sin cargos en este periodo</td><td></td></tr>'}</tbody>
    <tfoot><tr><td>Cargos de ${plabel(p)}</td><td class="r num">${money(r.subtotal)}</td></tr></tfoot></table>
    <table style="margin-top:.6rem"><tbody>
      ${r.pagado?`<tr><td>Pagos aplicados</td><td class="r num">− ${money(r.pagado)}</td></tr>`:''}
      <tr><td>Deuda de meses anteriores${r.prev.length?` <span class="mut">(${r.prev.length} ${r.prev.length>1?'conceptos':'concepto'})</span>`:''}</td><td class="r num">${money(r.anterior)}</td></tr>
    </tbody></table>
    <div class="total"><div><p class="mut">Total a pagar</p><p class="mut" style="font-size:.82rem">Vence el ${fdate(r.vence)}${S.config.mora>0?`. Después se aplica una mora de ${money(S.config.mora)}.`:''}</p></div><strong>${money(Math.max(0,r.total))}</strong></div>
    ${base?`<h4>Gastos del edificio en ${plabel(base)}</h4><table><tbody>${Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="r num">${money(v)}</td></tr>`).join('')}</tbody><tfoot><tr><td>Total de gastos</td><td class="r num">${money(sum(gb))}</td></tr></tfoot></table>`:''}
    <div class="foot"><span>Paga a: ${esc(c.banco)}. Yape o Plin: ${esc(c.yape)}. Sube tu constancia en Building Buddy.</span><span>Generado con Building Buddy</span></div>
  </div>`;
}
const reciboTexto=(id,p)=>{const r=reciboData(id,p);return `${S.config.edificio}\nRecibo de mantenimiento ${Plabel(p)}, depto ${id}\nTotal a pagar: ${money(Math.max(0,r.total))}\nVence: ${fdate(r.vence)}\nPaga a: ${S.config.banco}. Yape o Plin: ${S.config.yape}`};

VIEWS.mes=()=>{
  const p=pActual(),po=periodoObj(p),n=nextP(p),k=calcular(p);
  const cuotas=S.compromisos.filter(c=>c.periodo===p&&(c.tipo==='cuota'||c.tipo==='adelanto'));

      <li class="${corte?'done':''}"><div><b>Corte automático del día ${S.config.diaCorte}</b><p class="small muted">${corte?`Aplicado el ${fdate(corte.fecha)}. Departamentos sin pago: ${corte.deptos.join(', ')||'ninguno'}.`:`Se aplicará solo el ${fdate(p+'-'+pad(S.config.diaCorte+1))}.`}</p></div><span></span></li>
      <li class="${po.gastosConfirmados?'done':''}"><div><b>Confirmar gastos del mes</b><p class="small muted">${po.gastosConfirmados?'Confirmados. Los gastos quedan bloqueados.':'Bloquea los gastos y vuelve oficial el estado de cuenta.'}</p></div>${po.gastosConfirmados?'':`<button class="btn sm" data-act="confirmarGastos" data-p="${p}">Confirmar</button>`}</li>
      <li class="${po.gastosConfirmados?'done':''}"><div><b>Calcular cuotas de ${plabel(n)}</b><p class="small muted">Total a repartir: ${money(k.total)} (${S.config.tipoCalculo==='mixta'?'mixta con agua':'fija por alícuota'}).</p></div><button class="btn quiet sm" data-act="go" data-v="calculo">Ver cálculo</button></li>

        <div class="tbl" style="margin-top:.6rem"><table><thead><tr><th>Depto</th><th>Responsable</th><th class="r">Cuota</th><th></th></tr></thead><tbody>

    </tbody><tfoot><tr><td colspan="2">Total</td><td class="r num">${money(sum(rows,r=>r.pend))}</td><td class="r num">${money(sum(rows,r=>r.venc))}</td><td colspan="2"></td></tr></tfoot></table></div>`;

};

/* =========================================================
   MÓDULOS ADICIONALES (en prueba)
   ========================================================= */
function trialBar(id){
  const m=MODS.find(x=>x.id===id),d=diasRest(S.modulos[id].hasta);
  return `<div class="trialbar" style="--c:${m.c}"><span><b>Prueba gratis:</b> ${d} ${d===1?'día':'días'} restantes. Incluido en el plan ${m.plan} (S/ ${m.precio} al mes).</span><span class="spacer"></span><button class="btn sm" data-act="upgrade" data-id="${id}">Activar plan ${m.plan}</button></div>`;
}
/* =========================================================
   MÓDULO ÁREAS COMUNES (RN-30 a RN-37)
   ========================================================= */
const DIAS=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const zona=id=>(S.zonas||[]).find(z=>z.id===id);
const toMin=t=>{const[h,m]=t.split(':').map(Number);return h*60+m};
const toHM=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const RES_ACTIVAS=['solicitada','pendiente_pago','confirmada'];
const LBLR={solicitada:'Por aprobar',pendiente_pago:'Pendiente de pago',confirmada:'Confirmada',usada:'Usada',cancelada:'Cancelada',rechazada:'Rechazada',expirada:'Expirada'};
const CHR={solicitada:'revision',pendiente_pago:'pendiente',confirmada:'pagado',usada:'tag',cancelada:'tag',rechazada:'vencido',expirada:'vencido'};
const chipR=e=>`<span class="chip ${CHR[e]}">${LBLR[e]}</span>`;
const LBLG={sin_garantia:'Sin garantía',por_cobrar:'Garantía por cobrar',en_custodia:'Garantía en custodia',por_devolver:'Garantía por devolver',devuelta:'Garantía devuelta',retenida:'Garantía retenida'};
const diasTxt=d=>d.length===7?'Todos los días':d.slice().sort().map(x=>DIAS[x]).join(', ');
function turnos(z,fecha){
  const dow=new Date(fecha+'T12:00:00').getDay(),out=[];
  for(let m=toMin(z.apertura);m+z.turno<=toMin(z.cierre);m+=z.turno){
    const ini=toHM(m),fin=toHM(m+z.turno);let libre=true,motivo='';
    const bl=(S.bloqueos||[]).find(b=>b.zonaId===z.id&&b.fecha===fecha);
    if(!z.activa){libre=false;motivo='No disponible'}
    else if(!z.dias.includes(dow)){libre=false;motivo='No abre este día'}
    else if(bl){libre=false;motivo=bl.motivo}
    else if(S.reservas.some(r=>r.zonaId===z.id&&r.fecha===fecha&&RES_ACTIVAS.includes(r.estado)&&toMin(r.ini)<m+z.turno&&toMin(r.fin)>m)){libre=false;motivo='Reservado'}
    out.push({ini,fin,libre,motivo});
  }
  return out;
}
function emitirCargosReserva(r){
  const z=zona(r.zonaId),txt=`${z.nombre}, ${fdate(r.fecha)} ${r.ini}`,vence=addDays(hoy(),z.plazoDias);
  if(z.tarifa>0){const c={id:uid('cmp'),deptoId:r.deptoId,periodo:pActual(),tipo:'reserva',concepto:'Reserva: '+txt,monto:z.tarifa,emitido:hoy(),vence,estado:'pendiente'};S.compromisos.push(c);r.cTarifa=c.id}
  if(z.garantia>0){const c={id:uid('cmp'),deptoId:r.deptoId,periodo:pActual(),tipo:'garantia',concepto:'Garantía reembolsable: '+txt,monto:z.garantia,emitido:hoy(),vence,estado:'pendiente'};S.compromisos.push(c);r.cGarantia=c.id;r.gMonto=z.garantia;r.gEstado='por_cobrar'}
  r.estado='pendiente_pago';r.vencePago=vence;
}
function onCompromisoPagado(c){
  if(!c||!['reserva','garantia'].includes(c.tipo))return;
  const r=(S.reservas||[]).find(x=>x.cTarifa===c.id||x.cGarantia===c.id);if(!r)return;
  if(c.tipo==='garantia')r.gEstado=['cancelada','expirada'].includes(r.estado)?'por_devolver':'en_custodia';
  if(r.estado==='pendiente_pago'&&[r.cTarifa,r.cGarantia].filter(Boolean).every(id=>S.compromisos.find(x=>x.id===id)?.estado==='pagado'))r.estado='confirmada';
}
function aplicarExpiraciones(){
  (S.reservas||[]).filter(r=>r.estado==='pendiente_pago'&&r.vencePago<hoy()).forEach(r=>{
    const cs=[r.cTarifa,r.cGarantia].filter(Boolean).map(id=>S.compromisos.find(x=>x.id===id));
    if(cs.some(c=>c&&c.estado==='en_revision'))return;
    cs.forEach(c=>{if(c&&c.estado==='pendiente')c.estado='anulado'});
    r.estado='expirada';r.gEstado=r.gEstado==='en_custodia'?'por_devolver':'sin_garantia';
  });
}
const esMiaReserva=r=>{const u=sessionUser();return u&&u.deptoId===r.deptoId};
function filaReserva(r,acciones){
  const z=zona(r.zonaId);
  return `<div class="due-row"><div class="what"><b>${esc(z?.nombre||'Zona eliminada')}</b> <span class="muted">${fdate(r.fecha)}, ${r.ini} a ${r.fin}</span>
    <p class="small muted">Depto ${r.deptoId}, ${esc(residente(r.deptoId))}${r.gMonto?`. ${LBLG[r.gEstado]} (${money(r.gMonto)})`:''}${r.gRetenida?`, retenido ${money(r.gRetenida)}`:''}</p>
    ${r.nota?`<p class="small">${esc(r.nota)}</p>`:''}</div>${chipR(r.estado)}<div class="row">${acciones||''}</div></div>`;
}
VIEWS.areas=()=>{
  const t=ui.arTab,trial=modEstado('areas')==='prueba'?trialBar('areas'):'';
  const R=S.reservas.slice().sort((a,b)=>(a.fecha+a.ini).localeCompare(b.fecha+b.ini));
  const sec=(tit,l,fn,vacio)=>`<div class="panel"><h3>${tit} <span class="muted small">(${l.length})</span></h3>${l.length?l.map(r=>filaReserva(r,fn(r))).join(''):`<p class="small muted">${vacio}</p>`}</div>`;
  let body='';
  if(t==='reservas'){
    body=sec('Por aprobar',R.filter(r=>r.estado==='solicitada'),r=>`<button class="btn danger sm" data-act="rechazarRes" data-id="${r.id}">Rechazar</button><button class="btn ok sm" data-act="aprobarRes" data-id="${r.id}">Aprobar</button>`,'No hay solicitudes pendientes.')
     +sec('Pendientes de pago',R.filter(r=>r.estado==='pendiente_pago'),r=>`<span class="small muted">Vence el ${fdate(r.vencePago)}</span><button class="btn quiet sm" data-act="cancelarRes" data-id="${r.id}">Cancelar</button>`,'Ninguna.')
     +sec('Próximas confirmadas',R.filter(r=>r.estado==='confirmada'&&r.fecha>=hoy()),r=>`<button class="btn quiet sm" data-act="cancelarRes" data-id="${r.id}">Cancelar</button>`,'Ninguna.')
     +sec('Por cerrar (ya se usaron)',R.filter(r=>r.estado==='confirmada'&&r.fecha<hoy()),r=>`<button class="btn sm" data-act="cerrarRes" data-id="${r.id}">Cerrar${r.gEstado==='en_custodia'?' y resolver garantía':''}</button>`,'Ninguna.')
     +sec('Garantías por devolver',R.filter(r=>r.gEstado==='por_devolver'),r=>`<button class="btn sm" data-act="devolverG" data-id="${r.id}">Registrar devolución</button>`,'Ninguna.');
  }else if(t==='zonas'){
    body=`<div class="row" style="margin-bottom:1rem"><span class="spacer"></span><button class="btn" data-act="zonaForm">Nueva zona</button></div>
    <div class="cards3">${S.zonas.map(z=>`<div class="card"><div class="row"><h3>${esc(z.nombre)}</h3><span class="spacer"></span>${z.activa?'<span class="chip activo">Activa</span>':'<span class="chip inactivo">Inactiva</span>'}</div>
      <p class="small muted" style="margin:.3rem 0 .5rem">${esc(z.descripcion||'')}</p>
      <p class="small">${diasTxt(z.dias)}, ${z.apertura} a ${z.cierre}. Turnos de ${z.turno>=60?nf(z.turno/60,z.turno%60?1:0)+' h':z.turno+' min'}.</p>
      <p class="small">${z.tarifa?money(z.tarifa):'Sin costo'}${z.garantia?` + garantía ${money(z.garantia)}`:''}. Aforo ${z.aforo}.</p>
      <p class="small muted">Reserva de ${z.antMin} a ${z.antMax} días antes; máximo ${z.maxMes} al mes por departamento.${z.aprobacion?' Requiere aprobación.':''}${z.morosos?'':' No para departamentos con deuda vencida.'}</p>
      ${(S.bloqueos||[]).filter(b=>b.zonaId===z.id&&b.fecha>=hoy()).map(b=>`<p class="small" style="margin-top:.3rem">Bloqueado el ${fdate(b.fecha)}: ${esc(b.motivo)} <button class="btn ghost sm" data-act="quitarBloqueo" data-id="${b.id}">Quitar</button></p>`).join('')}
      <div class="row" style="margin-top:.7rem"><button class="btn quiet sm" data-act="zonaForm" data-id="${z.id}">Editar</button><button class="btn quiet sm" data-act="bloqueoForm" data-id="${z.id}">Bloquear una fecha</button></div></div>`).join('')||'<p class="empty">Aún no hay zonas. Crea la primera.</p>'}</div>`;
  }else{
    const enC=R.filter(r=>r.gEstado==='en_custodia'),porD=R.filter(r=>r.gEstado==='por_devolver'),ret=R.filter(r=>r.gEstado==='retenida');
    body=`<div class="figs"><div class="fig"><small>En custodia</small><strong>${money(sum(enC,r=>r.gMonto))}</strong></div><div class="fig"><small>Por devolver</small><strong>${money(sum(porD,r=>r.gMonto))}</strong></div><div class="fig"><small>Retenido por daños (ingreso)</small><strong>${money(sum(ret,r=>r.gRetenida))}</strong></div></div>
    <p class="hint" style="margin-bottom:1rem">La garantía es dinero de los vecinos: no se suma al saldo del edificio. Solo la parte retenida por daños pasa a ser ingreso, en el mes en que se retiene.</p>
    ${sec('En custodia',enC,()=>'','Ninguna.')}${sec('Por devolver',porD,r=>`<button class="btn sm" data-act="devolverG" data-id="${r.id}">Registrar devolución</button>`,'Ninguna.')}${sec('Retenidas',ret,()=>'','Ninguna.')}`;
  }
  return `<div class="pagehead"><div><h1>Áreas comunes</h1><p class="muted">Configura las zonas y gestiona las reservas del edificio.</p></div></div>${trial}
  <div class="tabs" role="tablist"><button class="${t==='reservas'?'on':''}" data-act="arTab" data-t="reservas">Reservas</button><button class="${t==='zonas'?'on':''}" data-act="arTab" data-t="zonas">Zonas</button><button class="${t==='garantias'?'on':''}" data-act="arTab" data-t="garantias">Garantías</button></div>${body}`;
};
VIEWS.reservas=u=>{
  const z=ui.zonaSel?zona(ui.zonaSel):null;
  const mias=S.reservas.filter(r=>r.deptoId===u.deptoId).sort((a,b)=>(b.fecha+b.ini).localeCompare(a.fecha+a.ini));
  const misRes=`<div class="panel"><h3>Mis reservas</h3>${mias.length?mias.map(r=>filaReserva(r,
      (r.estado==='pendiente_pago'?`<button class="btn sm" data-act="go" data-v="cuentas">Pagar cargos</button>`:'')
     +(RES_ACTIVAS.includes(r.estado)&&r.fecha>hoy()?`<button class="btn quiet sm" data-act="cancelarRes" data-id="${r.id}">Cancelar</button>`:''))).join(''):'<p class="small muted">Aún no tienes reservas.</p>'}</div>`;
  if(!z)return `<div class="pagehead"><div><h1>Áreas comunes</h1><p class="muted">Elige una zona para ver los turnos libres.</p></div></div>
    <div class="cards3">${S.zonas.filter(x=>x.activa).map(x=>`<div class="card"><h3>${esc(x.nombre)}</h3><p class="small muted" style="margin:.3rem 0 .5rem">${esc(x.descripcion||'')}</p>
      <p class="small"><b>${x.tarifa?money(x.tarifa):'Sin costo'}</b>${x.garantia?` + garantía reembolsable ${money(x.garantia)}`:''}</p><p class="small muted">${diasTxt(x.dias)}, ${x.apertura} a ${x.cierre}</p>
      <button class="btn sm" style="margin-top:.7rem" data-act="verZona" data-id="${x.id}">Ver turnos</button></div>`).join('')||'<p class="empty">La administración aún no configuró zonas.</p>'}</div>${misRes}`;
  const f=ui.fechaRes&&ui.fechaRes>=addDays(hoy(),z.antMin)&&ui.fechaRes<=addDays(hoy(),z.antMax)?ui.fechaRes:addDays(hoy(),z.antMin);

    <p class="small muted">${z.tarifa?money(z.tarifa):'Sin costo'}${z.garantia?` + garantía reembolsable ${money(z.garantia)}`:''}. Reserva de ${z.antMin} a ${z.antMax} días antes, máximo ${z.maxMes} al mes.${z.aprobacion?' La administración debe aprobar la solicitud.':''}</p></div>${misRes}`;
};

VIEWS.estado=u=>{
  const p=ui.ep||pActual(),po=periodoObj(p),r=resumen(p);
  const canDes=u.rol==='admin'||S.config.publicarDesglose;
  const ingBy={};r.ing.forEach(x=>{const t=tipoC(x.compromisoId);ingBy[t]=(ingBy[t]||0)+x.monto});
  if(r.retP.length)ingBy.garantia_retenida=sum(r.retP,x=>x.gRetenida);
  const cust=custodia();
  const TL={cuota:'Cuotas de mantenimiento',mora:'Moras cobradas',extraordinario:'Cuotas extraordinarias',adelanto:'Pagos adelantados',ajuste:'Ajustes de cuota',reserva:'Reservas de áreas comunes',garantia_retenida:'Garantías retenidas por daños'};
  const gtab=tipo=>{const l=r.gas.filter(g=>g.tipo===tipo);return l.map(g=>`<tr><td>${esc(g.categoria)}</td><td class="muted">${esc(g.descripcion)}</td><td class="r num">${money(g.monto)}</td></tr>`).join('')||`<tr><td colspan="3" class="muted">Sin registros</td></tr>`};
  return `<div class="pagehead noprint"><div><h1>Estado de cuenta</h1><p class="muted">Documento mensual del edificio.</p></div><span class="spacer"></span>
    <label class="small muted">Periodo <select data-change="setEP" class="btn quiet sm">${S.periodos.map(x=>`<option value="${x.id}" ${x.id===p?'selected':''}>${Plabel(x.id)}</option>`).join('')}</select></label>
    <button class="btn quiet sm" data-act="print">Imprimir o guardar PDF</button></div>
  <article class="statement">
    <div class="st-head"><div><h2>Estado de cuenta mensual</h2><p class="muted small">${esc(S.config.edificio)}, ${esc(S.config.direccion)}</p></div><span class="stamp ${po?.gastosConfirmados?'oficial':'borrador'}">${po?.gastosConfirmados?'Oficial':'Borrador'}</span></div>
    <dl class="meta">
      <div><dt>Periodo</dt><dd>${Plabel(p)}</dd></div>
      <div><dt>Administrador a cargo</dt><dd>${esc(S.config.admin)}</dd></div>
      <div><dt>Fecha de emisión</dt><dd>${fdate(hoy())}</dd></div>
    </dl>
    <div class="figs">
      <div class="fig"><small>Saldo anterior</small><strong>${money(r.ant)}</strong></div>
      <div class="fig"><small>Total de ingresos</small><strong class="pos">+ ${money(r.ti)}</strong></div>
      <div class="fig"><small>Total de gastos</small><strong class="neg">− ${money(r.tg)}</strong></div>
      <div class="fig"><small>Monto acumulado</small><strong class="${r.acum>=0?'pos':'neg'}">${money(r.acum)}</strong><small>${r.acum>=0?'Saldo positivo':'Saldo negativo'}</small></div>
    </div>
    ${cust?`<p class="hint">Garantías de reservas en custodia: <b>${money(cust)}</b>. Es dinero de los vecinos y no forma parte del saldo del edificio.</p>`:''}
    <h3>Ingresos</h3>
    <div class="tbl"><table><tbody>${Object.keys(ingBy).length?Object.entries(ingBy).map(([t,m])=>`<tr><td>${TL[t]}</td><td class="r num">${money(m)}</td></tr>`).join(''):'<tr><td class="muted">Sin ingresos validados</td></tr>'}</tbody><tfoot><tr><td>Total de ingresos (${r.ing.length} pagos validados)</td><td class="r num">${money(r.ti)}</td></tr></tfoot></table></div>
    <h3>Gastos recurrentes</h3><div class="tbl"><table><tbody>${gtab('recurrente')}</tbody></table></div>
    <h3>Gastos extraordinarios</h3>
    <div class="tbl"><table><tbody>${gtab('extraordinario')}</tbody><tfoot><tr><td colspan="2">Total de gastos</td><td class="r num">${money(r.tg)}</td></tr></tfoot></table></div>
    ${canDes?`<label class="row small noprint" style="margin-top:1.2rem"><input type="checkbox" data-change="toggleDes" ${ui.desglose?'checked':''}> Mostrar cuentas por cobrar por departamento</label>
    ${ui.desglose?`<h3>Cuentas por cobrar por departamento</h3><div class="tbl"><table><thead><tr><th>Depto</th><th class="r">Pendiente</th><th class="r">Vencido</th></tr></thead><tbody>
      ${S.departamentos.map(d=>{const pe=sum(porCobrar(d.id)),ve=sum(vencidos(d.id));return pe?`<tr><td>${d.id}</td><td class="r num">${money(pe)}</td><td class="r num ${ve?'neg':''}">${money(ve)}</td></tr>`:''}).join('')||'<tr><td colspan="3" class="muted">Todos los departamentos están al día</td></tr>'}
      </tbody><tfoot><tr><td>Total por cobrar</td><td class="r num">${money(sum(porCobrar()))}</td><td class="r num">${money(sum(vencidos()))}</td></tr></tfoot></table></div>`:''}`:''}
    <p class="small muted" style="margin-top:1.5rem">Monto acumulado = saldo anterior + ingresos validados del mes − gastos del mes. ${po?.gastosConfirmados?'Gastos confirmados por la administración.':'Documento preliminar: los gastos del mes aún no han sido confirmados.'}</p>
  </article>`;
};

  const items=[...pend,...adel].sort((a,b)=>a.vence.localeCompare(b.vence));
  const pags=S.pagos.filter(p=>p.deptoId===d).sort((a,b)=>b.fecha.localeCompare(a.fecha));
  return `<div class="pagehead"><div><h1>Depto ${d}</h1><p class="muted">${esc(persona(u.personaId)?.nombre)}</p></div></div>
  <div class="balance"><div><small class="muted">Total por pagar</small><strong>${money(sum(pend))}</strong>${venc?`<span class="chip vencido">${money(venc)} vencido</span>`:sum(pend)?'':'<span class="chip aldia">Estás al día</span>'}</div>
    <div class="row"><button class="btn quiet" data-act="recibo" data-id="${d}" data-p="${pActual()}">Ver mi recibo de ${MESES[+pActual().slice(5)-1]}</button><button class="btn quiet" data-act="depto" data-id="${d}">Mi cuenta corriente</button><button class="btn" data-act="adelanto">Pagar meses por adelantado</button></div></div>
  <div class="panel"><h3>Por pagar</h3>
  ${items.length?items.map(c=>{const st=estadoC(c);const rech=S.pagos.filter(p=>p.compromisoId===c.id&&p.estado==='rechazado').pop();return `<div class="due-row">
    <div class="what"><b>${esc(c.concepto)}</b><p class="small muted">Vence el ${fdate(c.vence)} ${c.tipo==='adelanto'?'<span class="chip tag">Adelanto</span>':''}</p>${rech&&c.estado==='pendiente'?`<p class="note">Comprobante rechazado: ${esc(rech.nota||'sin motivo')}. Vuelve a enviarlo.</p>`:''}</div>
    ${chip(st)}<b class="num">${money(c.monto)}</b>
    ${c.estado==='en_revision'?'<span class="small muted">Esperando validación</span>':`<button class="btn sm" data-act="pagar" data-id="${c.id}">Pagar y subir comprobante</button>`}
  </div>`}).join(''):'<p class="empty">No tienes pagos pendientes.</p>'}
  </div>
  <div class="panel"><h3>Mis pagos</h3>
  ${pags.length?`<div class="tbl"><table><thead><tr><th>Fecha</th><th>Concepto</th><th>Medio</th><th class="r">Monto</th><th>Estado</th><th></th></tr></thead><tbody>
    ${pags.map(p=>`<tr><td>${fdate(p.fecha)}</td><td>${esc(S.compromisos.find(c=>c.id===p.compromisoId)?.concepto)}</td><td>${esc(p.metodo)}</td><td class="r num">${money(p.monto)}</td><td>${chip(p.estado)}</td><td class="r">${p.archivo?`<button class="btn quiet sm" data-act="verComp" data-id="${p.id}">Comprobante</button>`:''}</td></tr>`).join('')}
  </tbody></table></div>`:'<p class="muted small">Aún no registras pagos.</p>'}</div>`;
};
VIEWS.reportes=()=>{
  const p=ui.rp||pActual(),r=resumen(p);
  const byCat={};r.gas.forEach(g=>byCat[g.categoria]=(byCat[g.categoria]||0)+g.monto);
  const max=Math.max(1,...Object.values(byCat));
  const ps=S.periodos.slice(-6).map(x=>({id:x.id,...resumen(x.id)}));
  const mx=Math.max(1,...ps.map(x=>Math.max(x.ti,x.tg)));
  const al=S.departamentos.filter(d=>!vencidos(d.id).length).length;
  return `<div class="pagehead"><div><h1>Reportes</h1><p class="muted">Cómo se usa el dinero del edificio.</p></div><span class="spacer"></span>
    <label class="small muted">Periodo <select data-change="setRP" class="btn quiet sm">${S.periodos.map(x=>`<option value="${x.id}" ${x.id===p?'selected':''}>${Plabel(x.id)}</option>`).join('')}</select></label></div>
  <div class="figs"><div class="fig"><small>Ingresos de ${plabel(p)}</small><strong>${money(r.ti)}</strong></div><div class="fig"><small>Gastos de ${plabel(p)}</small><strong>${money(r.tg)}</strong></div><div class="fig"><small>Monto acumulado</small><strong class="${r.acum>=0?'pos':'neg'}">${money(r.acum)}</strong></div><div class="fig"><small>Departamentos sin deuda vencida</small><strong>${al} de ${S.departamentos.length}</strong></div></div>
  <div class="panel"><h3>Gastos por categoría, ${plabel(p)}</h3><div class="bars">
    ${Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([c,m])=>`<div class="bar"><span>${esc(c)}</span><div class="track"><div class="fill" style="width:${m/max*100}%"></div></div><span class="num">${money(m)}</span></div>`).join('')||'<p class="muted small">Sin gastos registrados.</p>'}
  </div></div>
  <div class="panel"><h3>Ingresos y gastos por mes</h3>
    <div class="legend" style="margin:0 0 .5rem"><span><i style="background:var(--brand)"></i>Ingresos</span><span><i style="background:var(--brass)"></i>Gastos</span></div>
    <div class="cols">${ps.map(x=>`<div class="col"><div class="pair"><div style="height:${x.ti/mx*100}%;background:var(--brand)" title="Ingresos ${money(x.ti)}"></div><div style="height:${x.tg/mx*100}%;background:var(--brass)" title="Gastos ${money(x.tg)}"></div></div><span class="small">${MESES[+x.id.slice(5)-1].slice(0,3)}</span></div>`).join('')}</div>
  </div>`;
};

const modal=document.getElementById('modal'),sheet=document.getElementById('sheet');
let lastFocus=null;
function openModal(title,html,wide){
  lastFocus=document.activeElement;
  sheet.className='sheet'+(wide?' wide':'');
  sheet.innerHTML=`<div class="sheet-head"><h2>${title}</h2><button class="x" data-act="close" aria-label="Cerrar">×</button></div>${html}`;
  modal.hidden=false;
  const f=sheet.querySelector('input:not([type=hidden]),select,textarea,button:not(.x)');(f||sheet.querySelector('.x')).focus();
}
function closeModal(){modal.hidden=true;sheet.innerHTML='';pendingFile=null;confirmCb=null;lastFocus?.focus?.()}
function askConfirm(title,text,yes,cb){openModal(title,`<p>${text}</p><div class="row" style="margin-top:1.2rem;justify-content:flex-end"><button class="btn quiet" data-act="close">Cancelar</button><button class="btn" data-act="doConfirm">${yes}</button></div>`);confirmCb=cb}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),3400)}

function modalDepto(id){
  const u=sessionUser(),isAdm=u.rol==='admin';
  const ev=[...S.compromisos.filter(c=>c.deptoId===id&&!(c.tipo==='adelanto'&&c.estado!=='pagado'&&c.vence>=hoy())).map(c=>({f:c.emitido,t:c.concepto,cargo:c.monto,abono:0})),
    ...S.pagos.filter(p=>p.deptoId===id&&p.estado==='validado').map(p=>({f:p.fecha,t:`Pago ${p.metodo}${p.operacion?', op. '+p.operacion:''}`,cargo:0,abono:p.monto}))].sort((a,b)=>a.f.localeCompare(b.f)||b.cargo-a.cargo);
  let s=0;
  const rows=ev.map(e=>{s+=e.cargo-e.abono;return `<tr><td>${fdate(e.f)}</td><td>${esc(e.t)}</td><td class="r num">${e.cargo?money(e.cargo):''}</td><td class="r num">${e.abono?money(e.abono):''}</td><td class="r num">${money(s)}</td></tr>`}).join('');
  const pend=S.compromisos.filter(c=>c.deptoId===id&&c.estado==='pendiente'&&!(c.tipo==='adelanto'&&c.vence>=hoy()));
  const prop=ocupActiva(id,'propietario');
  openModal(`Depto ${id}`,`<p class="muted">${esc(residente(id))}${prop&&userDe(id)?.personaId!==prop.personaId?`, propietario: ${esc(persona(prop.personaId)?.nombre)}`:''}. Alícuota ${pct(alic(depto(id)))}.</p>
    <div class="row" style="margin:.8rem 0">${chip(estadoDepto(id))}<span class="spacer"></span><b>${s>0.004?'Saldo deudor':s<-0.004?'Saldo a favor':'Saldo'} <span class="num ${s>0.004?'neg':''}">${money(Math.abs(s))}</span></b></div>
    <h3 style="margin-bottom:.4rem">Cuenta corriente</h3>
    <div class="tbl"><table><thead><tr><th>Fecha</th><th>Concepto</th><th class="r">Cargo</th><th class="r">Abono</th><th class="r">Saldo</th></tr></thead><tbody>${rows}</tbody></table></div>
    ${isAdm&&pend.length?`<h3 style="margin:1.2rem 0 .4rem">Registrar pago en efectivo</h3>${pend.map(c=>`<div class="due-row"><div class="what small">${esc(c.concepto)}</div><b class="num">${money(c.monto)}</b><button class="btn ok sm" data-act="efectivo" data-id="${c.id}">Registrar pago</button></div>`).join('')}`:''}
    <div class="row" style="justify-content:flex-end;margin-top:1rem"><button class="btn" data-act="recibo" data-id="${id}" data-p="${pActual()}">${isAdm?'Generar y enviar recibo':'Ver recibo'}</button></div>`,true);
}

function modalRecibo(id,p){
  const isAdm=sessionUser().rol==='admin';
  const resp=persona(userDe(id)?.personaId);
  const e=S.recibos.find(x=>x.deptoId===id&&x.periodo===p);
  const wa=`https://wa.me/51${(resp?.telefono||'').replace(/\D/g,'')}?text=${encodeURIComponent(reciboTexto(id,p))}`;
  openModal(`Recibo ${Plabel(p)}, depto ${id}`,`${reciboHTML(id,p)}
    <div class="row" style="margin-top:1rem">
      ${isAdm?`<span class="small muted">${e?`Enviado el ${fdate(e.enviado)} a ${esc(resp?.email||'—')}`:`Se enviará a ${esc(resp?.email||'sin correo registrado')}`}</span>`:''}<span class="spacer"></span>
      <button class="btn quiet" data-act="pdf" data-id="${id}" data-p="${p}">Descargar PDF</button>
      <button class="btn quiet" data-act="compartir" data-id="${id}" data-p="${p}">Compartir</button>
      ${isAdm?`<a class="btn quiet" href="${wa}" target="_blank" rel="noopener" data-act="waSent" data-id="${id}" data-p="${p}">WhatsApp</a><button class="btn" data-act="enviar" data-id="${id}" data-p="${p}">${e?'Reenviar por correo':'Enviar por correo'}</button>`:''}
    </div>`,true);
}

function modalComprobante(pid){
  const p=S.pagos.find(x=>x.id===pid),a=p.archivo||{};
  let prev='<p class="muted small">Este comprobante histórico no tiene vista previa en la demo.</p>';
  if(a.data&&a.tipo?.startsWith('image/'))prev=`<img src="${a.data}" alt="Comprobante de pago del depto ${p.deptoId}">`;
  else if(a.data&&a.tipo==='application/pdf')prev=`<embed src="${a.data}" type="application/pdf" width="100%" height="420"><p class="small muted">Si el PDF no se muestra, tu navegador no permite la vista previa aquí.</p>`;
  const isAdm=sessionUser().rol==='admin';

    const tot=ds.reduce((t,id)=>t+alic(depto(id)),0);
    ds.forEach(id=>{const monto=v.reparto==='alicuota'?r2(+v.monto*alic(depto(id))/tot):+v.monto;
      S.compromisos.push({id:uid('cmp'),deptoId:id,periodo:pActual(),tipo:'extraordinario',concepto:v.concepto.trim(),monto,emitido:hoy(),vence:v.vence,estado:'pendiente'})});
    closeModal();commit();toast(`Compromiso emitido a ${ds.length} ${ds.length>1?'departamentos':'departamento'}.`)},
  rechazo:v=>{const p=S.pagos.find(x=>x.id===v.id);p.estado='rechazado';p.nota=v.nota.trim();const c=S.compromisos.find(x=>x.id===p.compromisoId);if(c)c.estado='pendiente';closeModal();commit();toast(`Comprobante del depto ${p.deptoId} rechazado.`)},
  pago:v=>{if(!pendingFile)return toast('Adjunta el comprobante antes de enviar.');const c=S.compromisos.find(x=>x.id===v.cid);
    S.pagos.push({id:uid('pag'),compromisoId:c.id,deptoId:c.deptoId,monto:c.monto,metodo:v.metodo,operacion:v.operacion.trim(),fecha:hoy(),archivo:pendingFile,estado:'en_revision',nota:''});
    c.estado='en_revision';closeModal();commit();toast('Comprobante enviado. La administración lo validará.')},
  adelanto:v=>{const u=sessionUser(),id=u.deptoId,est=estimadoCuota(id);let n=pActual(),k=0;
    for(let i=0;i<+v.meses;i++){n=nextP(n);if(S.compromisos.find(c=>c.deptoId===id&&c.periodo===n&&(c.tipo==='cuota'||c.tipo==='adelanto')))continue;
      S.compromisos.push({id:uid('cmp'),deptoId:id,periodo:n,tipo:'adelanto',concepto:'Cuota adelantada, '+plabel(n),monto:est,emitido:hoy(),vence:n+'-'+pad(S.config.diaCorte),estado:'pendiente'});k++}
    closeModal();commit();toast(k?`Se agregaron ${k} ${k>1?'cuotas adelantadas':'cuota adelantada'} a tus pagos.`:'Esos meses ya estaban solicitados.')},
  nuevoDepto:v=>{const id=v.id.trim();if(!/^[0-9A-Za-z-]{1,6}$/.test(id))return toast('Usa un número de departamento corto, por ejemplo 501.');if(depto(id))return toast(`El depto ${id} ya existe.`);
    S.departamentos.push({id,piso:+v.piso,area:r2(+v.area)});
    const pid=uid('per');S.personas.push({id:pid,nombre:v.propietario.trim(),dni:'',telefono:'',email:v.inquilino.trim()?'':v.email.trim()});
    S.ocupaciones.push({id:uid('oc'),deptoId:id,personaId:pid,tipo:'propietario',desde:hoy(),hasta:null,activo:true});let resp=pid;
    if(v.inquilino.trim()){const iid=uid('per');S.personas.push({id:iid,nombre:v.inquilino.trim(),dni:'',telefono:'',email:v.email.trim()});S.ocupaciones.push({id:uid('oc'),deptoId:id,personaId:iid,tipo:'inquilino',desde:hoy(),hasta:null,activo:true});resp=iid}
    S.usuarios.push({id:uid('usr'),login:id.toLowerCase(),pass:v.pass,rol:'hab',deptoId:id,personaId:resp,estado:'activo'});
    closeModal();commit();toast(`Depto ${id} agregado. Usuario ${id}, clave ${v.pass}.`)},
  editDepto:v=>{const d=depto(v.id);d.piso=+v.piso;d.area=r2(+v.area)||d.area;
    const prop=ocupActiva(v.id,'propietario');if(prop)persona(prop.personaId).nombre=v.propietario.trim();
    const resp=persona(userDe(v.id)?.personaId);if(resp){resp.email=v.email.trim();resp.telefono=v.telefono.trim()}
    closeModal();commit();toast(`Depto ${v.id} actualizado.`)},
  ocupante:v=>{const dep=v.depto,old=userDe(dep);
    if(old){old.estado='inactivo';old.baja=v.desde}
    const tipos=v.tipo==='propietario'?['propietario','inquilino']:['inquilino'];
    S.ocupaciones.filter(o=>o.deptoId===dep&&o.activo&&tipos.includes(o.tipo)).forEach(o=>{o.activo=false;o.hasta=v.desde});
    const pid=uid('per');S.personas.push({id:pid,nombre:v.nombre.trim(),dni:v.dni,telefono:v.telefono,email:v.email.trim()});
    S.ocupaciones.push({id:uid('oc'),deptoId:dep,personaId:pid,tipo:v.tipo,desde:v.desde,hasta:null,activo:true});
    S.usuarios.push({id:uid('usr'),login:dep.toLowerCase(),pass:v.pass,rol:'hab',deptoId:dep,personaId:pid,estado:'activo'});
    if(sess.userId===old?.id)sess.userId='u_admin';
    closeModal();commit();toast(`${v.nombre} registrado en el depto ${dep}. Usuario ${dep}, clave ${v.pass}.`)},
  pass:v=>{const u=sessionUser();if(v.actual!==u.pass)return toast('La contraseña actual no es correcta.');if(v.nueva!==v.rep)return toast('Las contraseñas nuevas no coinciden.');u.pass=v.nueva;commit();toast('Contraseña cambiada.')},
  ticket:v=>{S.tickets.push({id:uid('tk'),titulo:v.titulo.trim(),prioridad:v.prioridad,estado:'Abierto',fecha:hoy(),reporta:'Administración'});commit();toast('Ticket creado.')},
  chat:v=>{const u=sessionUser(),txt=v.texto.trim();if(!txt)return;
    const now=()=>hoy()+' '+new Date().toTimeString().slice(0,5);
    const admName=S.config.admin.split(' ').slice(0,2).join(' ')+' (Administración)';
    S.chat.push({id:uid('m'),rol:u.rol,deptoId:u.deptoId,nombre:u.rol==='admin'?admName:persona(u.personaId)?.nombre,texto:txt,fecha:now()});
    commit();
    setTimeout(()=>{
      let r;
      if(u.rol==='admin'){const us=S.usuarios.filter(x=>x.rol==='hab'&&x.estado==='activo');const x=us[Math.floor(Math.random()*us.length)];r={rol:'hab',deptoId:x.deptoId,nombre:persona(x.personaId)?.nombre,texto:['Gracias por el aviso.','Entendido, gracias.','¿Podría enviarlo también por correo?','Perfecto, lo tendré en cuenta.'][Math.floor(Math.random()*4)]}}
      else r={rol:'admin',deptoId:null,nombre:admName,texto:['Gracias por escribir. Lo reviso y te respondo hoy.','Recibido. Lo coordino con el conserje.','Anotado, lo incluyo en el próximo informe.'][Math.floor(Math.random()*3)]};
      S.chat.push({id:uid('m'),...r,fecha:now()});save();if(view==='chat')render();
    },1400)}
};

/* =========================================================
   DELEGACIÓN DE EVENTOS
   ========================================================= */
document.addEventListener('click',e=>{
  if(e.target===modal){closeModal();return}
  const t=e.target.closest('[data-act]');if(!t)return;
  const f=A[t.dataset.act];if(f)f(t.dataset,t,e);
});
document.addEventListener('change',e=>{const t=e.target.closest('[data-change]');if(t&&C[t.dataset.change])C[t.dataset.change](t)});
document.addEventListener('input',e=>{const t=e.target.closest('[data-input]');if(t&&I[t.dataset.input])I[t.dataset.input](t)});
document.addEventListener('submit',e=>{const f=e.target;if(f.dataset.form&&F[f.dataset.form]){e.preventDefault();const v={};new FormData(f).forEach((val,k)=>{if(typeof val==='string')v[k]=val});F[f.dataset.form](v,f)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!modal.hidden)closeModal()});
window.addEventListener('resize',()=>{const top=document.querySelector('.top');if(top)document.documentElement.style.setProperty('--toph',top.offsetHeight+'px')});

const _purgados=depurarInactivos();
if(S){aplicarCorte();aplicarExpiraciones()}save();render();
if(_purgados.length)toast(`Se eliminaron por inactividad: ${_purgados.join(', ')}.`);
</script>
